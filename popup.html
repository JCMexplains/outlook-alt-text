<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outlook Alt Text Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      color: #333;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #1a1a1a;
    }

    .description {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #0078d4;
      box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2);
    }

    button {
      width: 100%;
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #106ebe;
    }

    button:active {
      background: #005a9e;
    }

    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }

    .status.success {
      display: block;
      background: #dff6dd;
      color: #107c10;
    }

    .status.error {
      display: block;
      background: #fde7e9;
      color: #d13438;
    }

    .status.info {
      display: block;
      background: #f3f2f1;
      color: #666;
    }

    .help-link {
      display: block;
      margin-top: 16px;
      font-size: 12px;
      color: #0078d4;
      text-decoration: none;
    }

    .help-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Outlook Alt Text</h1>
  <p class="description">
    Auto-generate alt text for images you paste into Outlook emails using Claude AI.
  </p>

  <label for="api-key">Claude API Key</label>
  <input type="password" id="api-key" placeholder="sk-ant-...">

  <button id="save-btn">Save API Key</button>

  <div id="status" class="status"></div>

  <a class="help-link" href="https://console.anthropic.com/settings/keys" target="_blank">
    Get your API key from Anthropic Console
  </a>

  <script src="popup.js"></script>
</body>
</html>
